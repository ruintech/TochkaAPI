name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: mvn verify
        run: ./mvnw -B --no-transfer-progress verify

      - name: Save artefacts
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: target/*.jar
          retention-days: 14

      - name: Save failed tests reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7

  codegen:
    name: Generation is equal to specification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate models and code
        run: python3 codegen/generate.py

      - name: Check diff
        run: |
          if ! git diff --quiet -- src/main/java/com/tochka/api/model src/main/java/com/tochka/api/api; then
            echo "::error::Generated code not equal to swagger.json."
            echo "Please run 'python3 codegen/generate.py' and commit result."
            git --no-pager diff --stat -- src/main/java/com/tochka/api/model src/main/java/com/tochka/api/api
            exit 1
          fi
          echo "Generated code is actual."
