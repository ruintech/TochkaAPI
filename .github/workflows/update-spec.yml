name: Update API specification

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  SPEC_URL: https://enter.tochka.com/doc/openapi/swagger.json
  ROOT_CA: src/main/resources/com/tochka/api/tls/russian_trusted_root_ca.pem

jobs:
  update:
    name: Check API updates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download specification
        run: curl -fsSL --cacert "$ROOT_CA" -o swagger.json "$SPEC_URL"

      - name: Diff with current
        id: spec
        run: |
          if git diff --quiet -- swagger.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Specification not changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(python3 -c 'import json;print(json.load(open("swagger.json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate code
        if: steps.spec.outputs.changed == 'true'
        run: python3 codegen/generate.py

      - name: Update project version
        if: steps.spec.outputs.changed == 'true'
        run: |
          VERSION="$(echo '${{ steps.spec.outputs.version }}' | sed -E 's/^v//; s/-stable$//')-SNAPSHOT"
          echo "New version: $VERSION"
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        if: steps.spec.outputs.changed == 'true'
        run: ./mvnw -B --no-transfer-progress verify

      - name: Open PR
        if: steps.spec.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_VERSION: ${{ steps.spec.outputs.version }}
        run: |
          BRANCH="api-update/${SPEC_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists - PR already opened."
            exit 0
          fi

          {
            echo "## API changes"
            echo
            echo "Specification updated to \`${SPEC_VERSION}\`."
            echo
            echo "### Public methods"
            echo '```'
            git --no-pager diff --stat -- src/main/java/com/tochka/api/api
            echo '```'
            echo
            echo "### Models"
            echo '```'
            git --no-pager diff --stat -- src/main/java/com/tochka/api/model | tail -1
            echo '```'
          } > /tmp/pr-body.md

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Update API to ${SPEC_VERSION}"
          git push origin "$BRANCH"
          gh pr create --title "Update API to ${SPEC_VERSION}" --body-file /tmp/pr-body.md --base "${GITHUB_REF_NAME}"
