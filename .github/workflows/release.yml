name: Publication to Nexus

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: nexus

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Release version: $VERSION"
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: mvn deploy
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: ./mvnw -B --no-transfer-progress -s .mvn/ci-settings.xml deploy

      - name: Save artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: target/*.jar
          retention-days: 30
