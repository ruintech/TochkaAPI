name: Публикация в Nexus

# Релиз — по тегу vX.Y.Z: версия проекта берётся из тега, артефакты уходят в maven-releases.
# Снапшот можно опубликовать вручную кнопкой Run workflow.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Собрать и опубликовать
    runs-on: ubuntu-latest
    environment: nexus

    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Проставить версию из тега
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Релизная версия: $VERSION"
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # Учётные данные подставляются в .mvn/ci-settings.xml из переменных окружения,
      # на диск секреты не попадают.
      - name: mvn deploy
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw -B --no-transfer-progress -s .mvn/ci-settings.xml deploy \
            -Dnexus.releases.url="${{ vars.NEXUS_RELEASES_URL }}" \
            -Dnexus.snapshots.url="${{ vars.NEXUS_SNAPSHOTS_URL }}"

      - name: Сохранить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: target/*.jar
          retention-days: 30
